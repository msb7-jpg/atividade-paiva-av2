[project]
name = "paiva-av2"
version = "0.1.0"
description = "Estudo Comparativo Científico de Visão Computacional - 2ª Avaliação (CESAR School)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.40.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pillow>=10.3.0",
    "tqdm>=4.66.0",
    "datasets>=2.18.0",
    "opencv-python-headless>=4.9.0",
    "httpx>=0.27.0",
]

[project.scripts]
run-experiment = "src.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["src"]
